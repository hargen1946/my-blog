<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブログ</title>
<style>
  :root {
    --bg: #e8ede6;
    --panel: #f7f4ec;
    --tile: #fbf9f2;
    --border: #c7d3cd;
    --accent: #146c48;
    --accent-dim: #1f8a63;
    --text: #1c2a26;
    --text-dim: #4b5b56;
    --mono: "JetBrains Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }

  .console {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
    box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,0.15);
  }

  h1 {
    font-size: 26px;
    letter-spacing: 0.04em;
    margin: 0 0 6px 0;
    color: var(--accent);
    font-weight: 700;
    text-align: center;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-dim);
    margin-bottom: 28px;
    text-align: center;
  }

  .post-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .post-card {
    display: block;
    background: var(--tile);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 20px 22px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.15s ease;
  }

  .post-card:hover {
    border-color: var(--accent-dim);
    background: rgba(31, 138, 99, 0.06);
  }

  .post-date {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .post-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .post-desc {
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .post-card.placeholder {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
    border-style: dashed;
  }

  .footer-note {
    margin-top: 26px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="console">
  <h1>ブログ</h1>
  <div class="subtitle">NOTEの記事をまとめています</div>

  <div class="post-list">

    <!--
      ここから下が記事1つ分です。
      新しい記事を追加するときは、この <a class="post-card"> ~ </a> のかたまりを
      コピーして、下に貼り付けて内容を書き換えてください。

      href="記事のファイル名.html"  ← 実際の記事ページのファイル名に変更
      post-date  ← 日付
      post-title ← 記事タイトル
      post-desc  ← 記事の短い説明(1〜2行)
    -->
    <a class="post-card" href="article-sample.html">
      <div class="post-date">2026.07.25</div>
      <div class="post-title">(記事タイトルをここに)</div>
      <div class="post-desc">(記事の短い紹介文をここに。1〜2行くらいで内容が伝わるように書きます。)</div>
    </a>
    <!-- ここまでが記事1つ分 -->

    <div class="post-card placeholder">
      <div class="post-title">次の記事、準備中</div>
      <div class="post-desc">これから記事を追加していきます。</div>
    </div>

  </div>

  <div class="footer-note">記事を追加したら、ここにカードを増やしていきます</div>
</div>

</body>
</html>
